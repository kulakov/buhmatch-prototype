<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>БухМэтч — найди своего бухгалтера</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .phone {
            width: 375px;
            height: 700px;
            background: #fff;
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .phone::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background: #000;
            border-radius: 0 0 20px 20px;
            z-index: 10;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 45px 20px 15px;
            text-align: center;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .header .subtitle {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 4px;
        }

        .progress-bar {
            height: 3px;
            background: rgba(255,255,255,0.3);
            position: relative;
        }

        .progress-bar .fill {
            height: 100%;
            background: #4ade80;
            transition: width 0.5s ease;
            width: 0%;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            animation: fadeIn 0.3s ease;
            line-height: 1.4;
            font-size: 15px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            background: #f0f0f0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.highlight {
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            border: 1px solid #86efac;
        }

        .message .stat {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            margin: 0 2px;
        }

        .typing {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: #f0f0f0;
            border-radius: 18px;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.8); }
            40% { transform: scale(1.2); }
        }

        .buttons {
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #fff;
            border-top: 1px solid #eee;
        }

        .buttons.grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
        }

        .buttons.grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
        }

        .btn {
            padding: 14px 20px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            background: #fff;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn:hover {
            background: #f8f9fa;
            border-color: #667eea;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            font-weight: 600;
        }

        .btn.primary:hover {
            opacity: 0.9;
        }

        .btn.secondary {
            color: #666;
            font-size: 13px;
        }

        .btn.full {
            grid-column: 1 / -1;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            padding: 16px;
            margin: 8px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            animation: fadeIn 0.3s ease;
        }

        .card .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .card .name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .card .rating {
            color: #f59e0b;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .card .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0;
        }

        .card .tag {
            background: #f0f0f0;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: #666;
        }

        .card .price {
            font-size: 16px;
            font-weight: 600;
            color: #667eea;
            margin-top: 10px;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .card-actions .btn {
            flex: 1;
            padding: 12px;
        }

        .skip-btn {
            background: #fee2e2;
            color: #dc2626;
            border-color: #fecaca;
        }

        .like-btn {
            background: #dcfce7;
            color: #16a34a;
            border-color: #bbf7d0;
        }

        .match-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 100;
            animation: fadeIn 0.5s ease;
        }

        .match-overlay h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .match-overlay p {
            opacity: 0.9;
            margin-bottom: 30px;
        }

        .match-avatars {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .match-avatars .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .match-avatars .heart {
            font-size: 32px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .hidden {
            display: none !important;
        }

        .checkmark {
            color: #4ade80;
            margin-right: 6px;
        }

        .input-area {
            padding: 15px 20px;
            background: #fff;
            border-top: 1px solid #eee;
        }

        .input-area input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
        }

        .input-area input:focus {
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="phone">
        <div class="header">
            <h1>БухМэтч</h1>
            <div class="subtitle">Найдём вашего бухгалтера</div>
            <div class="progress-bar">
                <div class="fill" id="progress"></div>
            </div>
        </div>

        <div class="chat" id="chat"></div>

        <div class="buttons" id="buttons"></div>

        <div class="match-overlay hidden" id="matchOverlay">
            <h2>Мэтч! 🎉</h2>
            <p>Вы нашли друг друга</p>
            <div class="match-avatars">
                <div class="avatar">👤</div>
                <div class="heart">❤️</div>
                <div class="avatar">АС</div>
            </div>
            <button class="btn primary" onclick="showChat()" style="padding: 16px 40px;">Начать общение</button>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const buttons = document.getElementById('buttons');
        const progress = document.getElementById('progress');
        const matchOverlay = document.getElementById('matchOverlay');

        let currentStep = 0;
        let userData = {};

        const steps = [
            // 0: Приветствие
            {
                messages: [
                    { type: 'bot', text: 'Привет! 👋' },
                    { type: 'bot', text: 'Я помогу найти бухгалтера, который идеально подойдёт вашему бизнесу.' },
                    { type: 'bot', text: '7 вопросов — и покажу лучших кандидатов. Готовы?' }
                ],
                buttons: [
                    { text: 'Погнали! 🚀', action: () => nextStep(), primary: true }
                ],
                progress: 0
            },
            // 1: Отрасль
            {
                messages: [
                    { type: 'bot', text: 'Чем занимается ваш бизнес?' }
                ],
                buttons: [
                    { text: '🛒 Торговля', action: () => answer('industry', 'Торговля', '847 бухгалтеров со специализацией на торговле. Они знают маркировку, учёт товаров, работу с маркетплейсами.') },
                    { text: '💼 Услуги', action: () => answer('industry', 'Услуги', '1 100+ бухгалтеров для сферы услуг.') },
                    { text: '💻 IT', action: () => answer('industry', 'IT', '412 бухгалтеров, которые понимают IT-специфику: гранты, льготы, валютные контракты.') },
                    { text: '🏭 Производство', action: () => answer('industry', 'Производство', '380 бухгалтеров с опытом в производстве.') },
                    { text: '🏗 Строительство', action: () => answer('industry', 'Строительство', '290 бухгалтеров со строительной спецификой.') },
                    { text: '🍽 Общепит', action: () => answer('industry', 'Общепит', '215 бухгалтеров для общепита.') }
                ],
                grid: true,
                progress: 14
            },
            // 2: Форма собственности
            {
                messages: [
                    { type: 'bot', text: 'Какая у вас форма собственности?' }
                ],
                buttons: [
                    { text: 'ИП', action: () => answer('form', 'ИП', '62% наших клиентов — ИП. Бухгалтеры знают все нюансы.') },
                    { text: 'ООО', action: () => answer('form', 'ООО', '1 230 бухгалтеров с опытом работы с юрлицами.') },
                    { text: 'Самозанятый', action: () => answer('form', 'Самозанятый', 'Подберём консультанта для самозанятых.') },
                    { text: 'Пока не открыл', action: () => answer('form', 'Не открыл', 'Бухгалтер поможет выбрать форму и зарегистрировать бизнес.') }
                ],
                grid: true,
                progress: 28
            },
            // 3: Система налогообложения
            {
                messages: [
                    { type: 'bot', text: 'На какой системе налогообложения?' }
                ],
                buttons: [
                    { text: 'УСН 6%', action: () => answer('tax', 'УСН 6%', '89% наших клиентов на этой системе. Бухгалтеры знают её вдоль и поперёк.') },
                    { text: 'УСН 15%', action: () => answer('tax', 'УСН 15%', 'Разумный выбор для бизнеса с расходами.') },
                    { text: 'ОСНО', action: () => answer('tax', 'ОСНО', 'Подберём бухгалтера с серьёзным опытом НДС.') },
                    { text: 'Патент', action: () => answer('tax', 'Патент', 'Минимум отчётности — поможем не вылететь за лимиты.') },
                    { text: 'Не знаю', action: () => answer('tax', 'Не знаю', 'Бухгалтер разберётся и подскажет оптимальную систему.') }
                ],
                grid: true,
                progress: 42
            },
            // 4: Задачи
            {
                messages: [
                    { type: 'bot', text: 'Что должен делать бухгалтер?' }
                ],
                buttons: [
                    { text: '📋 Полное ведение', action: () => answer('tasks', 'Полное ведение', '73% клиентов выбирают полное сопровождение. Бухгалтер берёт всю рутину на себя.'), primary: true, full: true },
                    { text: 'Первичка', action: () => answer('tasks', 'Первичка', 'Подберём специалиста по первичным документам.') },
                    { text: 'Отчётность', action: () => answer('tasks', 'Отчётность', 'Только сдача отчётов — минимум затрат.') },
                    { text: 'Зарплата', action: () => answer('tasks', 'Зарплата', 'Расчёт ЗП и кадровый учёт.') },
                    { text: 'Консультации', action: () => answer('tasks', 'Консультации', 'Разовые консультации по вопросам учёта.') }
                ],
                grid: true,
                progress: 57
            },
            // 5: Документооборот
            {
                messages: [
                    { type: 'bot', text: 'Сколько документов в месяц проходит через компанию?' },
                    { type: 'bot', text: 'Считайте всё: акты, счета, накладные, договоры.' }
                ],
                buttons: [
                    { text: 'До 30', action: () => answer('docs', 'До 30', 'Минимальная нагрузка — от 5 000 ₽/мес.') },
                    { text: '30–60', action: () => answer('docs', '30–60', 'Средняя нагрузка — от 8 000 ₽/мес.') },
                    { text: '60–100', action: () => answer('docs', '60–100', 'Ощутимый объём — от 15 000 ₽/мес.') },
                    { text: '100–200', action: () => answer('docs', '100–200', 'Серьёзный поток — подберём опытного специалиста.') },
                    { text: '200+', action: () => answer('docs', '200+', 'Масштабный бизнес — возможно, нужна команда.') }
                ],
                grid: true,
                progress: 71
            },
            // 6: Оборот
            {
                messages: [
                    { type: 'bot', text: 'Какой оборот за последний год?' }
                ],
                buttons: [
                    { text: 'До 1 млн', action: () => answer('revenue', 'До 1 млн', 'Подберём бухгалтера с адекватными ценами для стартапов.') },
                    { text: '1–5 млн', action: () => answer('revenue', '1–5 млн', 'Растущий бизнес — поможем масштабироваться.') },
                    { text: '5–20 млн', action: () => answer('revenue', '5–20 млн', 'Серьёзный бизнес — подберём опытного специалиста.') },
                    { text: '20–60 млн', action: () => answer('revenue', '20–60 млн', 'Средний бизнес — нужен проверенный профессионал.') },
                    { text: '60+ млн', action: () => answer('revenue', '60+ млн', 'Крупный бизнес — подберём главбуха или команду.') },
                    { text: 'Не скажу', action: () => answer('revenue', 'Не указал', 'Ок, пропускаем этот вопрос.'), secondary: true }
                ],
                grid: true,
                progress: 85
            },
            // 7: Сотрудники
            {
                messages: [
                    { type: 'bot', text: 'Последний вопрос! 🎯' },
                    { type: 'bot', text: 'Сколько сотрудников в штате?' }
                ],
                buttons: [
                    { text: 'Только я', action: () => answer('employees', 'Только я', 'Зарплатный учёт не нужен — дешевле и проще.') },
                    { text: '2–5', action: () => answer('employees', '2–5', 'Компактная команда — зарплата входит в стоимость.') },
                    { text: '6–15', action: () => answer('employees', '6–15', 'Растущая команда — подберём бухгалтера с опытом кадрового учёта.') },
                    { text: '16–50', action: () => answer('employees', '16–50', 'Серьёзный штат — нужен опыт работы с большими командами.') },
                    { text: '50+', action: () => answer('employees', '50+', 'Большая компания — возможно, нужен отдельный специалист по зарплате.') }
                ],
                grid: true,
                progress: 100
            },
            // 8: Поиск
            {
                messages: [
                    { type: 'bot', text: 'Отлично! Анкета заполнена 🎉' },
                    { type: 'bot', text: 'Ищу подходящих бухгалтеров...' }
                ],
                buttons: [],
                progress: 100,
                autoNext: true,
                delay: 2000
            },
            // 9: Результаты
            {
                messages: [
                    { type: 'bot', text: 'Нашёл <span class="stat">12 бухгалтеров</span>, которые подходят!' },
                    { type: 'bot', text: 'Листайте как в Тиндере: ❌ — пропустить, ❤️ — нравится.' }
                ],
                buttons: [
                    { text: 'Показать бухгалтеров', action: () => showAccountants(), primary: true }
                ],
                progress: 100
            }
        ];

        const accountants = [
            {
                name: 'Анна Сидорова',
                initials: 'АС',
                rating: '⭐ 4.9 · 47 отзывов',
                experience: '8 лет опыта',
                tags: ['Торговля', 'УСН', 'Маркировка', 'Маркетплейсы'],
                price: 'от 12 000 ₽/мес',
                quote: '«Веду торговые компании с 2016 года»'
            },
            {
                name: 'Елена Козлова',
                initials: 'ЕК',
                rating: '⭐ 4.8 · 32 отзыва',
                experience: '6 лет опыта',
                tags: ['Торговля', 'УСН', 'ОСНО', 'Розница'],
                price: 'от 10 000 ₽/мес',
                quote: '«Помогу оптимизировать учёт»'
            },
            {
                name: 'Ирина Новикова',
                initials: 'ИН',
                rating: '⭐ 4.7 · 28 отзывов',
                experience: '10 лет опыта',
                tags: ['Торговля', 'ВЭД', 'Импорт', 'Китай'],
                price: 'от 15 000 ₽/мес',
                quote: '«Специализируюсь на импорте»'
            }
        ];

        let currentAccountant = 0;

        function addMessage(type, text, highlight = false) {
            const div = document.createElement('div');
            div.className = `message ${type}` + (highlight ? ' highlight' : '');
            div.innerHTML = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'typing';
            div.id = 'typing';
            div.innerHTML = '<span></span><span></span><span></span>';
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function hideTyping() {
            const typing = document.getElementById('typing');
            if (typing) typing.remove();
        }

        function renderButtons(btns, grid = false, grid3 = false) {
            buttons.innerHTML = '';
            buttons.className = 'buttons' + (grid ? (grid3 ? ' grid-3' : ' grid') : '');

            btns.forEach(btn => {
                const button = document.createElement('button');
                button.className = 'btn' +
                    (btn.primary ? ' primary' : '') +
                    (btn.secondary ? ' secondary' : '') +
                    (btn.full ? ' full' : '');
                button.textContent = btn.text;
                button.onclick = btn.action;
                buttons.appendChild(button);
            });
        }

        async function showStep(stepIndex) {
            const step = steps[stepIndex];

            progress.style.width = step.progress + '%';

            for (const msg of step.messages) {
                showTyping();
                await delay(800);
                hideTyping();
                addMessage(msg.type, msg.text, msg.highlight);
                await delay(300);
            }

            renderButtons(step.buttons, step.grid);

            if (step.autoNext) {
                await delay(step.delay || 1500);
                nextStep();
            }
        }

        function nextStep() {
            currentStep++;
            if (currentStep < steps.length) {
                showStep(currentStep);
            }
        }

        async function answer(key, value, response) {
            userData[key] = value;

            addMessage('user', value);

            buttons.innerHTML = '';

            showTyping();
            await delay(1000);
            hideTyping();

            addMessage('bot', '<span class="checkmark">✓</span> ' + response, true);

            await delay(500);
            nextStep();
        }

        function showAccountants() {
            currentAccountant = 0;
            showAccountantCard();
        }

        function showAccountantCard() {
            if (currentAccountant >= accountants.length) {
                showNoMore();
                return;
            }

            const acc = accountants[currentAccountant];

            chat.innerHTML = '';

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="avatar">${acc.initials}</div>
                <div class="name">${acc.name}</div>
                <div class="rating">${acc.rating}</div>
                <div style="color: #666; font-size: 14px;">${acc.experience}</div>
                <div class="tags">
                    ${acc.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                </div>
                <div style="font-style: italic; color: #666; margin-top: 10px;">${acc.quote}</div>
                <div class="price">${acc.price}</div>
            `;
            chat.appendChild(card);

            buttons.innerHTML = '';
            buttons.className = 'buttons';

            const cardActions = document.createElement('div');
            cardActions.className = 'card-actions';
            cardActions.innerHTML = `
                <button class="btn skip-btn" onclick="skipAccountant()">❌ Пропустить</button>
                <button class="btn like-btn" onclick="likeAccountant()">❤️ Нравится</button>
            `;
            buttons.appendChild(cardActions);
        }

        function skipAccountant() {
            currentAccountant++;
            showAccountantCard();
        }

        function likeAccountant() {
            matchOverlay.classList.remove('hidden');
        }

        function showChat() {
            matchOverlay.classList.add('hidden');
            chat.innerHTML = '';

            addMessage('bot', 'Отлично! Передал вашу заявку Анне Сидоровой.');

            setTimeout(() => {
                addMessage('bot', 'Она свяжется с вами в течение 24 часов.');
            }, 800);

            setTimeout(() => {
                addMessage('bot', '💡 Первая консультация — бесплатно!');
            }, 1600);

            buttons.innerHTML = '';
            buttons.className = 'buttons';

            setTimeout(() => {
                renderButtons([
                    { text: 'Написать Анне', action: () => {}, primary: true },
                    { text: 'Смотреть других', action: () => { currentAccountant++; showAccountantCard(); } }
                ]);
            }, 2000);
        }

        function showNoMore() {
            chat.innerHTML = '';
            addMessage('bot', 'Это все бухгалтеры по вашему запросу.');
            addMessage('bot', 'Хотите изменить параметры поиска?');

            renderButtons([
                { text: 'Изменить параметры', action: () => restart(), primary: true },
                { text: 'Оставить заявку', action: () => {} }
            ]);
        }

        function restart() {
            currentStep = 0;
            userData = {};
            chat.innerHTML = '';
            showStep(0);
        }

        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Start
        showStep(0);
    </script>
</body>
</html>
